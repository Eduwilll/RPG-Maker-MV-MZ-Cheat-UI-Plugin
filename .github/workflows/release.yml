name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser-regressions:
    uses: ./.github/workflows/browser-checks.yml

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate version and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/release_notes.py --tag "$RELEASE_TAG" --output release-notes.md
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Runtime, type, MV and documentation checks
        run: pnpm run check:repo
      - name: Build compact Offline and Online payloads
        run: pnpm run build:compact
      - name: Verify immutable Online dependency sources
        run: pnpm run check:dependency-sources
      - uses: actions/upload-artifact@v4
        with:
          name: compact-runtime
          path: output/runtime/
          if-no-files-found: error
      - name: Release metadata tests
        run: python -B -m unittest discover -s tests -p test_release_notes.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-packages:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: compact-runtime
          path: output/runtime
      - name: Build release packages
        run: python deploy/main.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            output/rpg-mv-cheat-${{ env.RELEASE_VERSION }}-core.tar.gz
            output/rpg-mz-cheat-${{ env.RELEASE_VERSION }}-core.tar.gz
            output/rpg-mv-cheat-${{ env.RELEASE_VERSION }}-online-core.tar.gz
            output/rpg-mz-cheat-${{ env.RELEASE_VERSION }}-online-core.tar.gz

  build-windows-installer:
    runs-on: windows-latest
    needs: [validate, build-packages, browser-regressions]
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: output
      - name: Install tested packaging tools
        run: python -m pip install pyinstaller==6.22.3 pillow==12.2.0
      - name: Installer, save-editor and preview-launcher tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Build Windows installer ZIP
        run: python tools/installer/build_windows.py --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: output/RPGMakerCheatInstaller-v${{ env.RELEASE_VERSION }}-windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [validate, build-packages, build-windows-installer]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: output
      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.RELEASE_VERSION }}
          draft: true
          body_path: output/release-notes.md
          fail_on_unmatched_files: true
          files: |
            output/rpg-mv-cheat-${{ env.RELEASE_VERSION }}-core.tar.gz
            output/rpg-mz-cheat-${{ env.RELEASE_VERSION }}-core.tar.gz
            output/rpg-mv-cheat-${{ env.RELEASE_VERSION }}-online-core.tar.gz
            output/rpg-mz-cheat-${{ env.RELEASE_VERSION }}-online-core.tar.gz
            output/RPGMakerCheatInstaller-v${{ env.RELEASE_VERSION }}-windows.zip
