name: Installer bug
description: The Windows installer (RPGMakerCheatInstaller.exe) won't launch, crashes, or fails to build.
title: "[Installer]: "
labels: ["bug", "installer"]
body:
  - type: input
    id: installer_version
    attributes:
      label: Installer version / ZIP filename
      description: Exact filename of the downloaded ZIP (e.g. RPGMakerCheatInstaller-v1.9.1-windows.zip) or "self-built" with version.
      placeholder: e.g. RPGMakerCheatInstaller-v1.9.1-windows.zip
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Did you download a release ZIP or build from source?
      options:
        - Downloaded from GitHub Releases
        - Self-built with `python -m tools.installer.build_windows`
        - Self-built with `py -3 deploy/main.py` then installer build
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      description: Run `winver` and paste the version (e.g. Windows 10 22H2 19045.5011, Windows 11 24H2).
      placeholder: e.g. Windows 10 22H2 19045.5011
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version (if self-built)
      description: Run `python --version` or `py -3 --version`. Leave blank if using downloaded ZIP.
      placeholder: e.g. Python 3.12.7
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Full error message / stack trace
      description: Paste the complete error. For "can't run" issues, include the popup text or console output. For build failures, include the last 30 lines of the build log.
      render: shell
      placeholder: |
        Traceback (most recent call last):
          File "pyi_rth__tkinter.py", line 36, in <module>
          File "pyi_rth__tkinter.py", line 28, in _pyi_rthook
        FileNotFoundError: Tcl data directory "C:\Users\...\Temp\_MEI336242\_tcl_data" not found.
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - Installer exe does nothing / no window appears
        - Error popup on launch (Tcl/Tk, DLL, etc.)
        - Installer opens but crashes when clicking Install/Uninstall
        - Build script fails (PyInstaller error, missing files, etc.)
        - Installer runs but game detection fails
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do? What did you expect?
      placeholder: |
        1. Downloaded RPGMakerCheatInstaller-v1.9.1-windows.zip
        2. Extracted to folder
        3. Double-clicked RPGMakerCheatInstaller.exe
        4. Expected: installer GUI opens
        5. Actual: error popup / nothing happens
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      description: Confirm before submitting.
      options:
        - label: Antivirus/Defender didn't quarantine the exe (check History → Quarantined items)
        - label: All files from ZIP are in the same folder (RPGMakerCheatInstaller.exe + rpg-mv-cheat-*.tar.gz + rpg-mz-cheat-*.tar.gz)
        - label: Ran as Administrator (right-click → Run as administrator)
        - label: Windows SmartScreen didn't block it (More info → Run anyway)
        - label: Tried re-downloading the ZIP (corrupted download check)