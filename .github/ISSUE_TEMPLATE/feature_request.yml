name: Feature request
description: Suggest a panel, cheat, or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: input
    id: game
    attributes:
      label: Game / engine (if relevant)
      description: Which game or engine (MV/MZ) motivated this request, if any.
      placeholder: e.g. any MZ game
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today, or what takes too many steps?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
      description: Describe the desired behavior. Mockups or example values help.
    validations:
      required: true
