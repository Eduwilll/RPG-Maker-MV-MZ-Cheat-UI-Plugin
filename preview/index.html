<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>RPG Maker Cheat Engine - UI Preview</title>

    <!-- Vuetify and MDI Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../cheat-engine/www/cheat/css/main.css" />
    <link rel="stylesheet" href="./preview.css" />
    <script>
      window.__previewErrors = [];
      window.addEventListener("error", function (event) { if (event.message) window.__previewErrors.push(event.message); });
      window.addEventListener("unhandledrejection", function (event) { window.__previewErrors.push(String(event.reason)); });
    </script>
  </head>

  <body>
    <div id="app">
      <p class="preview-loading">Loading the UI preview...</p>
    </div>

    <!-- Scripts -->
    <script src="../cheat-engine/www/cheat/libs/vue.js"></script>
    <script src="../cheat-engine/www/cheat/libs/vuetify.js"></script>
    <script src="../cheat-engine/www/cheat/libs/axios.min.js"></script>

    <!-- 1. Load RGP Maker Mocks first so CheatHelper can find them -->
    <script src="./rpg-mocks.js"></script>

    <!-- 2. Bootstrap the Vue app as a module -->
    <script type="module" src="./preview.js"></script>
  </body>
</html>
