<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RPG Maker Cheat Engine</title>

    <!-- Vendored UI assets: the plugin must work offline. -->
    <link href="./libs/roboto.css" rel="stylesheet" />
    <link href="./libs/mdi/materialdesignicons.min.css" rel="stylesheet" />

    <!-- Vuetify CSS -->
    <link href="./libs/vuetify.min.css" rel="stylesheet" />
    <link href="./css/main.css" rel="stylesheet" />

    <style>
      html { overflow-y: auto !important; }
      body {
        background-color: #0b1220;
        margin: 0;
        color: #e8eef9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      .v-application--wrap {
          min-height: 100vh;
      }

      /* The pop-out stays hidden until Vue mounts. The class lives on the
         mount node and is toggled on the live root, because Vue 2.7 keeps
         id="app" on the rendered element while leaving the original mount node
         behind as an empty, still-hidden wrapper. */
      #app.cheat-window-ready {
          display: block !important;
      }

      #app.cheat-window-app:not(.cheat-window-ready) {
          display: none;
      }

      #status-overlay {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: #0b1220;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          flex-direction: column;
          padding: 20px;
          text-align: center;
          font-size: 13px;
          letter-spacing: 0.01em;
      }

      #status-text {
          color: #9fb0c7;
      }

      .error-text {
          color: #f87171;
          font-family: "Cascadia Code", Consolas, monospace;
          white-space: pre-wrap;
          margin-top: 10px;
          background: rgba(248, 113, 113, 0.1);
          border: 1px solid rgba(248, 113, 113, 0.35);
          padding: 10px;
          border-radius: 8px;
          width: 100%;
          max-width: 600px;
      }
    </style>
  </head>
  <body>
    <div id="status-overlay">
      <div id="status-text">Initializing Cheat Engine...</div>
      <div id="error-display" style="display: none;" class="error-text"></div>
    </div>

    <div id="app" class="cheat-window-app">
      <v-app>
        <v-main>
          <cheat-modal v-model="activeComponentName" is-window></cheat-modal>
        </v-main>
        <alert-snackbar></alert-snackbar>
        <confirm-dialog></confirm-dialog>
      </v-app>
    </div>

    <!-- Load local libs -->
    <script src="./libs/vue.js"></script>
    <script src="./libs/vuetify.js"></script>
    <script src="./libs/axios.min.js"></script>

    <!-- Watchdog: module scripts fail silently (no window.onerror from the
         module itself), so surface load failures and stalls here. -->
    <script>
      (function () {
        function showBootError(text) {
          var display = document.getElementById("error-display");
          var status = document.getElementById("status-text");
          if (display) {
            display.textContent = text;
            display.style.display = "block";
          }
          if (status) {
            status.textContent = "Initialization Failed";
            status.style.color = "#ff5252";
          }
        }

        window.addEventListener(
          "error",
          function (event) {
            var src =
              (event && event.target && event.target.src) || "";
            if (src.indexOf("window-init") !== -1) {
              showBootError(
                "Failed to load js/window-init.bundle.js. Reinstall the cheat files."
              );
            }
          },
          true
        );

        setTimeout(function () {
          var app = document.getElementById("app");
          var status = document.getElementById("status-text");
          if (
            app &&
            app.style.display === "none" &&
            status &&
            status.textContent.indexOf("Initializing") !== -1
          ) {
            status.textContent =
              "Still initializing after 15s - open DevTools (F12) and look for [Cheat] errors.";
          }
        }, 15000);
      })();
    </script>

    <!-- Bridge script: the generated bundle built from js/window-init.js -->
    <script type="module" src="./js/window-init.bundle.js"></script>
  </body>
</html>
